# Bounds the suite's PostgreSQL connection demand. Spring caches one context per distinct test configuration,
# and every cached context keeps its Hikari pool (PostgresContainerSupport.TEST_POOL_SIZE) open, so demand is
# (cached contexts x pool size) against the container's max_connections of 100. Nearly every integration test
# class has a configuration of its own, so the default cache of 32 contexts no longer fits; evicting the least
# recently used context closes its pool. 16 x 4 = 64 leaves headroom for db-scheduler and ad-hoc connections.
spring.test.context.cache.maxSize=16
